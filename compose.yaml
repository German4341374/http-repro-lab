name: http-repro-lab
services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-http_repro}
      POSTGRES_USER: ${POSTGRES_USER:-http_repro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]

  api:
    build: { context: ./apps/api }
    environment:
      HTTP_REPRO_BIND: 0.0.0.0
      HTTP_REPRO_PORT: 8080
      DATABASE_URL: postgres://http_repro:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/http_repro?sslmode=disable
    ports: ["127.0.0.1:${HTTP_REPRO_API_PORT:-8080}:8080"]
    networks: [backend, frontend]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  web:
    build: { context: ., target: web }
    ports: ["127.0.0.1:${HTTP_REPRO_WEB_PORT:-8081}:8080"]
    networks: [frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m", "/var/cache/nginx:rw,noexec,nosuid,size=16m", "/var/run:rw,noexec,nosuid,size=2m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  mock-api:
    build: { context: ., target: mock-api }
    ports: ["127.0.0.1:${HTTP_REPRO_MOCK_PORT:-9090}:9090"]
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "/usr/local/bin/mock-api", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

networks:
  frontend: {}
  backend: { internal: true }
volumes:
  postgres-data: {}
