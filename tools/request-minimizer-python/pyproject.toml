[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "http-repro-minimizer"
version = "0.1.0"
description = "Deterministic request minimization for HTTP Repro Lab"
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.5"]

[project.optional-dependencies]
dev = ["mypy==1.19.1", "pytest==9.0.3", "ruff==0.14.10"]

[project.scripts]
http-repro-minimize = "http_repro_minimizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/http_repro_minimizer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["http_repro_minimizer"]
mypy_path = "src"

