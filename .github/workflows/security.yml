name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 2'
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with: { fail-on-severity: high }
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
  filesystem:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with: { scan-type: fs, scan-ref: ., format: sarif, output: trivy.sarif, severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1' }
      - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with: { sarif_file: trivy.sarif }
  codeql:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    strategy: { fail-fast: false, matrix: { language: ['go', 'javascript-typescript', 'python', 'csharp', 'java-kotlin'] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with: { languages: '${{ matrix.language }}' }
      - if: matrix.language == 'go'
        run: go build ./cmd/http-repro ./cmd/mock-api
      - if: matrix.language == 'java-kotlin'
        run: mvn -B -f runners/java-repro-runner/pom.xml -DskipTests package
      - if: matrix.language == 'csharp'
        run: dotnet build runners/dotnet-repro-runner/src/HttpRepro.Runner/HttpRepro.Runner.csproj --configuration Release
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
