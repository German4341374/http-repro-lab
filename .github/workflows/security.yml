name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 2'
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with: { fail-on-severity: high }
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
  filesystem:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with: { scan-type: fs, scan-ref: ., format: sarif, output: trivy.sarif, severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1' }
      - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with: { sarif_file: trivy.sarif }
  codeql:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    strategy: { fail-fast: false, matrix: { language: ['go', 'javascript-typescript', 'python', 'csharp', 'java-kotlin'] } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with: { languages: '${{ matrix.language }}' }
      - uses: github/codeql-action/autobuild@5ba2889ada762081db2c4f32a729827dce632c7b # v3
      - uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3

