name: Release
on:
  push:
    tags: ['v*.*.*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/reusable-core.yml
    with: { upload-binary: false }
  binaries:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: '1.26.7' }
      - name: Build archive
        env: { GOOS: '${{ matrix.goos }}', GOARCH: '${{ matrix.goarch }}', CGO_ENABLED: '0' }
        run: |
          suffix=''; [ "$GOOS" = windows ] && suffix='.exe'
          name="http-repro-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          mkdir "$name"
          go build -trimpath -ldflags="-s -w" -o "$name/http-repro${suffix}" ./cmd/http-repro
          cp LICENSE NOTICE README.md "$name/"
          if [ "$GOOS" = windows ]; then zip -r "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: 'binary-${{ matrix.goos }}-${{ matrix.goarch }}', path: 'http-repro-*.*', retention-days: 7 }
  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: 'binary-*', merge-multiple: true, path: release }
      - run: cd release && sha256sum * > SHA256SUMS
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

