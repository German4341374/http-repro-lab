name: Release
on:
  push:
    tags: ['v*.*.*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/reusable-core.yml
    with: { upload-binary: false }
  binaries:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.7' }
      - name: Build archive
        env: { GOOS: '${{ matrix.goos }}', GOARCH: '${{ matrix.goarch }}', CGO_ENABLED: '0' }
        run: |
          suffix=''; [ "$GOOS" = windows ] && suffix='.exe'
          name="http-repro-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          mkdir "$name"
          go build -trimpath -ldflags="-s -w" -o "$name/http-repro${suffix}" ./cmd/http-repro
          cp LICENSE NOTICE README.md "$name/"
          if [ "$GOOS" = windows ]; then zip -r "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: 'binary-${{ matrix.goos }}-${{ matrix.goarch }}', path: 'http-repro-*.*', retention-days: 7 }
  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: 'binary-*', merge-multiple: true, path: release }
      - run: cd release && sha256sum * > SHA256SUMS
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

