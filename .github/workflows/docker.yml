name: Docker
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-and-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with: { context: ., target: cli, load: true, tags: http-repro-lab:ci, cache-from: type=gha, cache-to: 'type=gha,mode=max' }
      - run: docker build --target mock-api -t http-repro-mock:ci .
      - run: docker build --target web -t http-repro-web:ci .
      - run: docker build -t http-repro-api:ci apps/api
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with: { image-ref: http-repro-lab:ci, format: table, severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1' }
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { image: http-repro-lab:ci, format: spdx-json, output-file: http-repro-lab.spdx.json }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: image-sbom, path: http-repro-lab.spdx.json, retention-days: 30 }
  compose-health:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl -fsS http://127.0.0.1:8080/health && curl -fsS http://127.0.0.1:8081/ && curl -fsS http://127.0.0.1:9090/health
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v --remove-orphans

