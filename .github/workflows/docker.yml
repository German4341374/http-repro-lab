name: Docker
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dockerfile-lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { dockerfile: [Dockerfile, apps/api/Dockerfile] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: '${{ matrix.dockerfile }}', failure-threshold: error }
  build-and-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: { context: ., target: cli, load: true, tags: http-repro-lab:ci, cache-from: type=gha, cache-to: 'type=gha,mode=max' }
      - run: docker build --target mock-api -t http-repro-mock:ci .
      - run: docker build --target web -t http-repro-web:ci .
      - run: docker build -t http-repro-api:ci apps/api
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with: { image-ref: http-repro-lab:ci, format: table, severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1' }
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { image: http-repro-lab:ci, format: spdx-json, output-file: http-repro-lab.spdx.json }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: image-sbom, path: http-repro-lab.spdx.json, retention-days: 30 }
  compose-health:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl -fsS http://127.0.0.1:8080/health && curl -fsS http://127.0.0.1:8081/ && curl -fsS http://127.0.0.1:9090/health
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v --remove-orphans
