name: Generated Clients
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: generated-clients-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.7', cache: true }
      - run: go run ./cmd/http-repro generate fixtures/echo-request.json --output generated
      - run: CGO_ENABLED=0 go build -trimpath -o generated/mock-api ./cmd/mock-api
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: generated-clients, path: generated, retention-days: 7 }
  verify:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: { language: [curl, javascript, typescript, python, go, java, csharp, php] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: generated-clients, path: generated }
      - run: chmod +x generated/mock-api && generated/mock-api >mock.log 2>&1 &
      - run: for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9090/health && exit 0; sleep 1; done; exit 1
      - if: matrix.language == 'javascript' || matrix.language == 'typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.14.1', cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - if: matrix.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.7' }
      - if: matrix.language == 'java'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: '21' }
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '8.0.x' }
      - if: matrix.language == 'php'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with: { php-version: '8.4', extensions: curl, coverage: none }
      - name: Execute generated client
        env: { LANGUAGE: '${{ matrix.language }}' }
        run: |
          case "$LANGUAGE" in
            curl) sh generated/curl/request.sh > result.txt ;;
            javascript) node generated/javascript/request.mjs > result.txt ;;
            typescript) npm ci --prefix apps/api --ignore-scripts && apps/api/node_modules/.bin/tsc generated/typescript/request.ts --target ES2023 --module NodeNext --moduleResolution NodeNext --types node --typeRoots apps/api/node_modules/@types --skipLibCheck --outDir generated/typescript/dist && node generated/typescript/dist/request.js > result.txt ;;
            python) python generated/python/request.py > result.txt ;;
            go) go run generated/go/main.go > result.txt ;;
            java) (cd generated/java && javac Main.java && java Main) > result.txt ;;
            csharp) cp runners/generated/csharp/GeneratedRepro.csproj generated/csharp/ && dotnet run --project generated/csharp/GeneratedRepro.csproj --configuration Release > result.txt ;;
            php) php generated/php/request.php > result.txt ;;
          esac
          grep -q 'POST' result.txt
          grep -q 'semantic-parity' result.txt
