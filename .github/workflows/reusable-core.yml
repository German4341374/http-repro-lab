name: Reusable Core
on:
  workflow_call:
    inputs:
      upload-binary:
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  go-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.7', cache: true }
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./cmd/... ./internal/...
      - name: Build CLI
        run: go build -trimpath -o dist/http-repro ./cmd/http-repro
      - name: Upload CLI
        if: inputs.upload-binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: http-repro-linux-amd64, path: dist/http-repro, retention-days: 7 }

