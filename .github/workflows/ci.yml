name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    uses: ./.github/workflows/reusable-core.yml
    with: { upload-binary: true }
  node:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.14.1', cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tools/request-minimizer-python/pyproject.toml }
      - run: python -m pip install -e 'tools/request-minimizer-python[dev]'
      - run: ruff check tools/request-minimizer-python
      - run: mypy
        working-directory: tools/request-minimizer-python
      - run: pytest tools/request-minimizer-python
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test runners/dotnet-repro-runner/tests/HttpRepro.Runner.Tests --configuration Release
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -f runners/java-repro-runner/pom.xml verify
  php:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: runners/php-repro-runner } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with: { php-version: '8.4', extensions: curl, coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: composer test
      - run: composer analyse
