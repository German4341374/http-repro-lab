name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    uses: ./.github/workflows/reusable-core.yml
    with: { upload-binary: true }
  node:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24.14.1', cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: tools/request-minimizer-python/pyproject.toml }
      - run: python -m pip install -e 'tools/request-minimizer-python[dev]'
      - run: ruff check tools/request-minimizer-python
      - run: mypy
        working-directory: tools/request-minimizer-python
      - run: pytest tools/request-minimizer-python
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test runners/dotnet-repro-runner/tests/HttpRepro.Runner.Tests --configuration Release
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -f runners/java-repro-runner/pom.xml verify
  php:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: runners/php-repro-runner } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with: { php-version: '8.4', extensions: curl, coverage: none }
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: composer test
      - run: composer analyse
