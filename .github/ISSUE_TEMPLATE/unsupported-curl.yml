name: Unsupported cURL
description: Request support for one safe cURL flag or syntax form.
title: "curl: support "
labels: [curl, enhancement, triage]
body:
  - type: input
    id: flag
    attributes: { label: Flag or syntax }
    validations: { required: true }
  - type: textarea
    id: example
    attributes: { label: Synthetic command, render: shell }
    validations: { required: true }
  - type: textarea
    id: semantics
    attributes: { label: Expected RequestSpec semantics }
    validations: { required: true }

