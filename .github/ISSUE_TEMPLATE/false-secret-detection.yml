name: False secret detection
description: Report a synthetic value that is incorrectly classified.
title: "privacy: false detection for "
labels: [privacy, bug, triage]
body:
  - type: textarea
    id: synthetic
    attributes: { label: Synthetic input, render: json }
    validations: { required: true }
  - type: input
    id: classification
    attributes: { label: Reported classification }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: The value is synthetic and not derived from a real secret.
          required: true

