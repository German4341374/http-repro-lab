version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups: { go-dependencies: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly }
    groups: { node-dependencies: { patterns: ['*'] } }
  - package-ecosystem: pip
    directory: /tools/request-minimizer-python
    schedule: { interval: weekly }
    groups: { python-dependencies: { patterns: ['*'] } }
  - package-ecosystem: maven
    directory: /runners/java-repro-runner
    schedule: { interval: weekly }
  - package-ecosystem: nuget
    directory: /runners/dotnet-repro-runner
    schedule: { interval: weekly }
  - package-ecosystem: composer
    directory: /runners/php-repro-runner
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ['*'] } }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

